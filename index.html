<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼音闯关 · a o e i u</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#FFF4DC; --card:#FFFFFF; --ink:#2B3A55; --ink-soft:#5B6B88;
  --line:#2B3A55; --shadow:#2B3A55;
  --ok:#2E9E62; --ok-bg:#DFF5E7; --bad:#E5484D; --bad-bg:#FFE1E2; --accent:#FFC83D;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#17223B; --card:#22304F; --ink:#F2F6FF; --ink-soft:#A9B8D6;
    --line:#9DB8EE; --shadow:#0A101F;
    --ok:#5BD08F; --ok-bg:#1D4A34; --bad:#FF7A80; --bad-bg:#5A2530;
  }
}
:root[data-theme="dark"]{
  --page:#17223B; --card:#22304F; --ink:#F2F6FF; --ink-soft:#A9B8D6;
  --line:#9DB8EE; --shadow:#0A101F;
  --ok:#5BD08F; --ok-bg:#1D4A34; --bad:#FF7A80; --bad-bg:#5A2530;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none !important}
.app{max-width:460px;margin:0 auto;padding:12px 14px 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top h1{margin:0;font-size:22px;line-height:1.2;font-weight:800}
.top .level{font-size:14px;color:var(--ink-soft);margin-top:2px}
.top .right{display:flex;align-items:center;gap:10px}
.hearts{display:flex;gap:4px}
.heart{width:28px;height:28px;fill:#F0384A;transform-origin:50% 60%}
.heart.lost{fill:#C5CDDC;opacity:.55}
.heart.break{animation:hbreak .7s ease-out}
@keyframes hbreak{0%{transform:scale(1)}25%{transform:scale(1.5) rotate(-12deg)}50%{transform:scale(.8) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);
  display:grid;place-items:center;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--shadow);padding:0;flex:none;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
:focus-visible{outline:3px solid #4C9BE8;outline-offset:3px}

/* 字母进度 */
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{
  flex:1;min-height:46px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
  font-size:24px;font-weight:800;position:relative;box-shadow:0 3px 0 var(--shadow);cursor:pointer;
  font-family:"Helvetica Neue",Arial,sans-serif;
}
.tab:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.tab.cur{background:var(--accent);color:#2B3A55}
.tab.done{border-color:var(--ok)}
.tab:disabled{opacity:.4;cursor:default}
.tab b{position:absolute;top:-9px;right:-5px;font-size:11px;background:var(--ok);color:#fff;border-radius:50%;width:19px;height:19px;line-height:19px;font-weight:800}

#scene-wrap{position:relative;overflow:hidden;border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);background:#CDEBFA}
#scene{display:block;width:100%;height:auto}

/* 角色 */
#pair{transition:transform .85s cubic-bezier(.45,.05,.25,1)}
#snail{transform-box:fill-box;transform-origin:50% 100%}
#snail.gone,#leash.gone{visibility:hidden}
#snail.crawl{animation:crawl .36s ease-in-out 2}
#snail.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes crawl{0%,100%{transform:scale(1,1)}50%{transform:scale(1.09,.9)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
#royBody{transform-box:fill-box;transform-origin:50% 100%}
#royBody.hop{animation:hop .5s ease-out}
#royBody.shake{animation:shake .12s 4}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
.mood{display:none}
#roy[data-mood="happy"] .mood.happy,
#roy[data-mood="cheer"] .mood.cheer,
#roy[data-mood="shock"] .mood.shock,
#roy[data-mood="sad"] .mood.sad{display:inline}

/* 爆炸 */
#boom{visibility:hidden}
#boom.go{visibility:visible}
#boom .burst{transform-origin:0 0}
#boom.go .burst{animation:burst .55s ease-out forwards}
@keyframes burst{0%{transform:scale(.2);opacity:1}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1.5);opacity:0}}
#boom .puff{fill:#fff;opacity:0;transform-origin:0 0}
#boom.go .puff{animation:puff .8s ease-out .08s forwards}
@keyframes puff{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.7);opacity:0}}
#boom.go .frag{animation:frag .95s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes frag{
  0%{transform:translate(0,0) scale(1);opacity:1}
  55%{transform:translate(calc(var(--dx)*1px),calc(var(--dy)*1px)) scale(1);opacity:1}
  100%{transform:translate(calc(var(--dx)*1.2px),calc(var(--dy)*1px + 34px)) scale(.4);opacity:0}
}
#boom .bang{font-weight:900;font-size:15px;fill:#E5484D;stroke:#fff;stroke-width:3;paint-order:stroke;text-anchor:middle;opacity:0;transform-box:fill-box;transform-origin:center}
#boom.go .bang{animation:bang 1s ease-out forwards}
@keyframes bang{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{transform:scale(1) translateY(-6px);opacity:0}}

.confetti{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(340px) rotate(var(--rot))}}

/* 学习卡 */
.learn{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;align-items:center;gap:14px}
.hero .letter{font-family:"Helvetica Neue",Arial,sans-serif;font-size:104px;font-weight:800;line-height:1;width:1.05em;text-align:center;flex:none}
.hero .say{flex:1;min-width:0}
.hero .tip{font-size:18px;line-height:1.55;font-weight:700;margin:0 0 6px}
.hero .word{font-size:15px;color:var(--ink-soft);margin:0}
.hero .icon-btn{width:46px;height:46px}
.tone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tone{border:3px solid var(--line);border-radius:16px;background:var(--card);padding:8px 2px 8px;text-align:center;box-shadow:0 3px 0 var(--shadow)}
.tone .m{font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;font-size:36px;font-weight:700;line-height:1.1}
.tone svg{display:block;margin:4px auto 2px;width:74%;max-width:64px;height:auto;color:var(--ink)}
.tone .n{font-size:14px;font-weight:700}
.tone .d{font-size:12px;color:var(--ink-soft)}
.song{margin:0;text-align:center;color:var(--ink-soft);font-size:15px}

/* 题目 */
.play{position:relative;margin-top:16px;min-height:330px}
.prompt{margin:0 0 4px;text-align:center;color:var(--ink-soft);font-size:15px}
.stem{display:flex;align-items:center;justify-content:center;gap:14px;min-height:104px}
.kai{font-family:"KaiTi","Kaiti SC","STKaiti","AR PL UKai CN","Songti SC","Noto Serif CJK SC",serif}
.py{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
.stem .cap{text-align:center;font-size:15px;font-weight:700;color:var(--ink-soft);margin-top:2px}
.stem svg{color:var(--ink);display:block;margin:0 auto}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.opt{
  min-height:88px;border:3px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);
  box-shadow:0 5px 0 var(--shadow);cursor:pointer;padding:6px 4px;touch-action:manipulation;
  transition:transform .08s, box-shadow .08s, background .15s;
}
.opt.py{font-size:29px;font-weight:700}
.opt.big{font-size:46px}
.opt.txt{font-size:21px;font-weight:700;font-family:inherit}
.opt.kai{font-size:50px}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.5}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.feedback{margin:16px 0 0;min-height:52px;text-align:center;font-size:16px;font-weight:600;line-height:1.5}
.feedback.ok{color:var(--ok)}
.feedback.bad{color:var(--bad)}

.overlay{
  position:absolute;inset:0;background:var(--page);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;padding:8px 6px;
}
.overlay h2{margin:0;font-size:28px;font-weight:800}
.overlay p{margin:0;max-width:20em;line-height:1.7;color:var(--ink-soft);font-size:16px}
.cta{
  margin-top:6px;padding:14px 30px;font-size:20px;font-weight:800;color:#2B3A55;background:var(--accent);
  border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--shadow);cursor:pointer;font-family:inherit;
}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.link-btn{background:none;border:0;color:var(--ink-soft);font-size:15px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:8px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>拼音闯关</h1>
      <div class="level" id="level"></div>
    </div>
    <div class="right">
      <button type="button" class="icon-btn" id="soundBtn" aria-label="声音开关" aria-pressed="true">🔊</button>
      <div class="hearts" id="hearts" role="img" aria-label="剩余 3 颗心"></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="按顺序学习字母"></nav>

  <div id="scene-wrap">
    <svg id="scene" viewBox="0 0 360 285" role="img" aria-label="Roy 牵着小蜗牛爬楼梯"></svg>
  </div>

  <section class="learn" id="learn" hidden></section>

  <section class="play" id="play" hidden>
    <p class="prompt" id="prompt"></p>
    <div class="stem">
      <div id="big"></div>
      <button type="button" class="icon-btn" id="listen" aria-label="听一听" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback" aria-live="polite"></p>
    <div class="overlay" id="overlay" hidden></div>
  </section>
</main>

<script>
(() => {
'use strict';

/* ================= 设置（可以直接改） ================= */
const LIVES = 3;                       // 每个字母的红心数
const LETTERS = ['a','o','e','i','u']; // 学习顺序
const SEQ = ['final','toneName','toneFind','c2p','p2c']; // 每个字母 5 级楼梯，对应 5 种题
const STEPS = SEQ.length;

// 每个字母的学习卡内容
const INFO = {
  a: {say:'阿', tip:'嘴巴张大大，像阿姨说“啊——”',      word:'👩 阿姨 āyí'},
  o: {say:'喔', tip:'嘴巴圆圆的，像公鸡叫“喔——”',        word:'🐓 公鸡 gōngjī'},
  e: {say:'鹅', tip:'嘴巴扁扁的，像白鹅叫“鹅——”',        word:'🦢 白鹅 é'},
  i: {say:'衣', tip:'嘴巴扁扁，牙齿对齐，像说“衣——”',    word:'👕 衣服 yīfu'},
  u: {say:'乌', tip:'嘴巴拢成小圆圈，像说“乌——”',        word:'🐦 乌鸦 wūyā'}
};
// 每个字母对应的字：[汉字, 拼音(数字表示声调)]，只收单一读音的字
const BANK = {
  a: [['妈','ma1'],['麻','ma2'],['马','ma3'],['爸','ba4'],['八','ba1'],['拔','ba2'],['大','da4'],['打','da3'],['他','ta1']],
  o: [['波','bo1'],['泼','po1'],['婆','po2'],['摸','mo1'],['佛','fo2'],['破','po4'],['墨','mo4']],
  e: [['喝','he1'],['河','he2'],['可','ke3'],['热','re4'],['车','che1'],['个','ge4'],['鹅','e2'],['饿','e4'],['这','zhe4']],
  i: [['衣','yi1'],['皮','pi2'],['米','mi3'],['笔','bi3'],['你','ni3'],['七','qi1'],['鸡','ji1'],['梨','li2'],['西','xi1'],['地','di4']],
  u: [['屋','wu1'],['五','wu3'],['书','shu1'],['木','mu4'],['兔','tu4'],['哭','ku1'],['布','bu4'],['虎','hu3'],['足','zu2'],['猪','zhu1']]
};
const TM = {a:['ā','á','ǎ','à'], o:['ō','ó','ǒ','ò'], e:['ē','é','ě','è'], i:['ī','í','ǐ','ì'], u:['ū','ú','ǔ','ù']};
const TONE_NAMES = ['第一声','第二声','第三声','第四声'];
const TONE_SHORT = ['平','扬','拐弯','降'];
const TONE_DESC = ['声音平平的','声音往上扬','先降后升，要拐弯','声音往下降'];

/*LOGIC-START*/
const INITIALS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const TONE_MARKS = {a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function split(py){
  const m = py.match(/^([a-z]+)([1-5])$/);
  const base = m[1], tone = +m[2];
  let ini = '';
  for (const i of INITIALS){ if (base.startsWith(i)){ ini = i; break; } }
  return {base, tone, ini, fin: base.slice(ini.length)};
}
function mark(py){
  const {base, tone} = split(py);
  const word = base.replace('v','ü');
  if (tone === 5) return word;
  let target = -1;
  if (word.includes('a')) target = word.indexOf('a');
  else if (word.includes('o')) target = word.indexOf('o');
  else if (word.includes('e')) target = word.indexOf('e');
  else { for (let i = word.length - 1; i >= 0; i--){ if ('iuü'.includes(word[i])){ target = i; break; } } }
  if (target < 0) return word;
  const ch = word[target];
  return word.slice(0,target) + TONE_MARKS[ch][tone-1] + word.slice(target+1);
}
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const PARSED = Object.entries(BANK).flatMap(([v, list]) => list.map(([c,p]) => ({c, p, v, ...split(p)})));
function similarTo(t, x){ return (x.ini && x.ini === t.ini) || (x.fin && x.fin === t.fin); }

// 看汉字选拼音：1~2 个"同音不同调"，其余是"长得像"的拼音
function pyOptions(t, pool){
  const allpy = [...new Set(pool.map(x => x.p))];
  const sameBase = [1,2,3,4].filter(n => n !== t.tone).map(n => t.base + n);
  const similar = allpy.filter(p => p !== t.p && !sameBase.includes(p) && similarTo(t, split(p)));
  const k = Math.random() < .5 ? 1 : 2;
  const picks = new Set([...shuffle(sameBase).slice(0,k), ...shuffle(similar).slice(0,2-k)]);
  for (const p of shuffle([...sameBase, ...similar, ...allpy])){
    if (picks.size >= 2) break;
    if (p !== t.p) picks.add(p);
  }
  return shuffle([t.p, ...picks]);
}
// 看拼音选汉字：干扰字读音一定和答案不同
function charOptions(t, pool){
  const others = pool.filter(x => x.p !== t.p);
  const sameBase = others.filter(x => x.base === t.base);
  const similar = others.filter(x => x.base !== t.base && similarTo(t, x));
  const picks = [];
  const add = list => { for (const x of shuffle(list)){ if (picks.length >= 2) return; if (!picks.some(y => y.c === x.c || y.p === x.p)) picks.push(x); } };
  add(shuffle(sameBase).slice(0,1));
  add(similar); add(others);
  return shuffle([t, ...picks]);
}
/*LOGIC-END*/

/* ================= 场景 ================= */
const $ = id => document.getElementById(id);
const VW = 360, VH = 285, Y0 = 255, X0 = 20, SC = 1.3;
const BLOCKS = STEPS + 2;
const W = Math.floor(300 / BLOCKS), H = Math.floor(160 / BLOCKS);
const pos = s => ({x: X0 + (s + .5) * W, y: Y0 - (s + 1) * H});

function starPts(n, R, r){
  const p = [];
  for (let i = 0; i < n*2; i++){
    const a = Math.PI * i / n - Math.PI / 2, rad = i % 2 ? r : R;
    p.push((Math.cos(a)*rad).toFixed(1) + ',' + (Math.sin(a)*rad).toFixed(1));
  }
  return p.join(' ');
}
// 声调曲线：0 一声平 / 1 二声扬 / 2 三声拐弯 / 3 四声降
const CONTOUR = ['M8 10 L52 10', 'M8 32 L52 10', 'M8 16 C16 36 32 42 52 8', 'M8 8 L52 34'];
function contourSVG(t, w, h){
  return `<svg viewBox="0 0 60 42" width="${w}" height="${h}" aria-hidden="true">
    <g stroke="currentColor" stroke-opacity=".18" stroke-dasharray="2 3"><path d="M4 10 H56 M4 21 H56 M4 32 H56"/></g>
    <path d="${CONTOUR[t]}" stroke="#E5484D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="${[8,8,8,8][t]}" cy="${[10,32,16,8][t]}" r="3.6" fill="#E5484D"/>
  </svg>`;
}

function sceneMarkup(){
  let stairs = '';
  for (let j = 1; j <= BLOCKS; j++){
    const x = X0 + (j-1) * W, top = Y0 - j * H, w = j === BLOCKS ? VW - x : W;
    stairs += `<rect x="${x}" y="${top}" width="${w}" height="${Y0 - top}" fill="${j % 2 ? '#E9A66B' : '#E29A5C'}" stroke="#C98446" stroke-width=".8"/>`
           +  `<rect x="${x}" y="${top}" width="${w}" height="4" fill="#F8D28F"/>`;
  }
  const baseY = Y0 - BLOCKS * H;
  const hx = X0 + BLOCKS * W + 4, hw = Math.min(34, VW - hx - 3);
  const house = `
    <rect x="${hx}" y="${baseY-26}" width="${hw}" height="26" fill="#FFF6E5" stroke="#C98446" stroke-width="1"/>
    <polygon points="${hx-3},${baseY-26} ${hx+hw/2},${baseY-46} ${hx+hw+1},${baseY-26}" fill="#E5484D"/>
    <text x="${hx+hw/2}" y="${baseY-29}" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">家</text>
    <rect x="${hx+hw/2-4.5}" y="${baseY-15}" width="9" height="15" rx="1.5" fill="#8B5A3C"/>
    <circle cx="${hx+hw/2+2.4}" cy="${baseY-7}" r=".9" fill="#FFD23F"/>`;
  const p0 = pos(0);
  const frags = [
    [-34,-28,'#FF7B6B',4.6],[30,-34,'#FF7B6B',4],[-20,-42,'#FFD23F',3],[38,-14,'#B9E27A',3.6],
    [-38,-6,'#B9E27A',3.2],[12,-46,'#fff',3],[-8,-30,'#FF7B6B',3.4],[26,-22,'#FFD23F',2.8],[-30,-16,'#fff',2.6]
  ].map(([dx,dy,c,r]) => `<g class="frag" style="--dx:${dx};--dy:${dy}"><circle r="${r}" fill="${c}"/></g>`).join('');
  const hand = {x: W / SC - 17, y: -H / SC - 19};

  return `
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ED8F5"/><stop offset="1" stop-color="#E6F6FD"/></linearGradient></defs>
  <rect width="${VW}" height="${VH}" fill="url(#sky)"/>
  <circle cx="38" cy="40" r="23" fill="#FFD23F" opacity=".3"/><circle cx="38" cy="40" r="15" fill="#FFD23F"/>
  <g fill="#fff" opacity=".95">
    <ellipse cx="128" cy="50" rx="25" ry="9"/><ellipse cx="146" cy="43" rx="14" ry="9"/><ellipse cx="112" cy="45" rx="12" ry="7"/>
    <ellipse cx="236" cy="30" rx="22" ry="8"/><ellipse cx="250" cy="24" rx="12" ry="8"/>
  </g>
  <ellipse cx="70" cy="266" rx="140" ry="42" fill="#A9DBA0"/><ellipse cx="290" cy="270" rx="110" ry="36" fill="#B8E3AE"/>
  ${stairs}${house}
  <rect x="0" y="${Y0}" width="${VW}" height="${VH - Y0}" fill="#7CC27A"/>

        <circle cx="-5.7" cy="-38.6" r="1.7" fill="#FF9AA0" opacity=".55"/><circle cx="5.7" cy="-38.6" r="1.7" fill="#FF9AA0" opacity=".55"/>

    <path id="leash" d="M${hand.x} ${hand.y} Q31 -30 23 -15" stroke="#E5484D" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <g id="snail">

      <path d="M17.5 -16.4 Q19.5 -14.6 21.6 -16.4" stroke="#3A5A1A" stroke-width="1" fill="none" stroke-linecap="round"/>
      <circle cx="22.6" cy="-15.4" r="1.2" fill="#FF9AA0" opacity=".7"/>
      <circle cx="23" cy="-15" r="1.7" fill="#E5484D"/>

      <circle cx="-3" cy="-15" r="7.5" fill="none" stroke="#fff" stroke-width="1.6" opacity=".75" stroke-dasharray="36 12"/>
      <circle cx="-3" cy="-15" r="3.6" fill="none" stroke="#fff" stroke-width="1.6" opacity=".75" stroke-dasharray="14 8"/>
      <circle cx="-8.5" cy="-20.5" r="2" fill="#fff" opacity=".5"/>
    </g>
    <!-- 爆炸 -->
    <g id="boom"><g transform="translate(-3,-15)">
      <polygon class="burst" points="${starPts(12,26,13)}" fill="#FFD23F" stroke="#FF8A00" stroke-width="1.5"/>
      <circle class="puff" cx="-8" cy="-2" r="10"/><circle class="puff" cx="9" cy="-6" r="9"/><circle class="puff" cx="0" cy="6" r="11"/>
      ${frags}
      <text class="bang" x="0" y="-32">砰!</text>
    </g></g>
  </g></g>`;
}

const svg = $('scene');
svg.innerHTML = sceneMarkup();
const pair = $('pair'), snail = $('snail'), leash = $('leash'), boom = $('boom'), roy = $('roy'), royBody = $('royBody');
const elLevel = $('level'), elHearts = $('hearts'), elPrompt = $('prompt'), elBig = $('big'), elTabs = $('tabs'),
      elListen = $('listen'), elOptions = $('options'), elFb = $('feedback'), elOv = $('overlay'),
      elLearn = $('learn'), elPlay = $('play'), soundBtn = $('soundBtn');

function place(s, instant){
  const p = pos(s);
  if (instant){ pair.style.transition = 'none'; }
  pair.style.transform = `translate(${p.x}px,${p.y}px)`;
  if (instant){ void pair.getBoundingClientRect(); pair.style.transition = ''; }
}
function restart(el, cls, others){
  (others || []).forEach(c => el.classList.remove(c));
  el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
}
snail.addEventListener('animationend', () => snail.classList.remove('crawl','pop'));
royBody.addEventListener('animationend', () => royBody.classList.remove('hop','shake'));
const mood = m => { roy.dataset.mood = m; };

/* ================= 声音 ================= */
let AC = null, soundOn = true;
function actx(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){ AC = null; }
  return AC;
}
function tone(f, t0, d, type, vol){
  const a = actx(); if (!a || !soundOn) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, a.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t0 + d);
  o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + d + .02);
}
const sfxOk  = () => { tone(660,0,.14,'triangle',.18); tone(990,.12,.2,'triangle',.18); };
const sfxWin = () => [523,659,784,1047].forEach((f,i) => tone(f,i*.13,.24,'triangle',.18));
function sfxBoom(){
  const a = actx(); if (!a || !soundOn) return;
  const len = (a.sampleRate * .5) | 0, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * (1 - i/len);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(1400, a.currentTime); f.frequency.exponentialRampToValueAtTime(120, a.currentTime + .45);
  const g = a.createGain(); g.gain.value = .5;
  s.connect(f).connect(g).connect(a.destination); s.start();
  tone(110,0,.35,'sine',.35);
}
function speak(text, force){
  if (!force && !soundOn) return;
  try {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = .8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){}
}

/* ================= 进度 ================= */
const KEY = 'pinyin-aoeiu-v1';
function loadDone(){
  try { const d = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(d) ? d.filter(x => LETTERS.includes(x)) : []; }
  catch(e){ return []; }
}
function saveDone(){ try { localStorage.setItem(KEY, JSON.stringify(S.done)); } catch(e){} }

/* ================= 状态 ================= */
const S = {i:0, s:0, hearts:LIVES, busy:true, q:null, last:null, timers:[], done:loadDone()};
const later = (fn, ms) => { S.timers.push(setTimeout(fn, ms)); };
const clearTimers = () => { S.timers.forEach(clearTimeout); S.timers = []; };
const unlocked = k => k === 0 || S.done.includes(LETTERS[k-1]);

const HEART = '<svg class="heart %C" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
function renderHearts(breakIdx){
  elHearts.innerHTML = Array.from({length: LIVES}, (_, i) =>
    HEART.replace('%C', (i >= S.hearts ? 'lost' : '') + (i === breakIdx ? ' break' : ''))).join('');
  elHearts.setAttribute('aria-label', `剩余 ${S.hearts} 颗心`);
}
const renderLevel = () => { elLevel.textContent = `字母 ${LETTERS[S.i]} · 已爬 ${S.s} / ${STEPS} 级`; };
function renderTabs(){
  elTabs.innerHTML = LETTERS.map((v, k) => {
    const done = S.done.includes(v), ok = unlocked(k);
    return `<button type="button" class="tab${k === S.i ? ' cur' : ''}${done ? ' done' : ''}" data-i="${k}" ${ok ? '' : 'disabled'} aria-label="字母 ${v}${done ? '，已学会' : ok ? '' : '，还没解锁'}">${v}${done ? '<b>✓</b>' : ''}</button>`;
  }).join('');
}

/* ================= 学习卡 ================= */
function showLearn(i){
  clearTimers();
  S.i = i; S.s = 0; S.hearts = LIVES; S.busy = true; S.q = null;
  const L = LETTERS[i], info = INFO[L];
  snail.classList.remove('gone','crawl','pop'); leash.classList.remove('gone'); boom.classList.remove('go');
  royBody.classList.remove('hop','shake'); mood('happy'); place(0, true);
  elOv.hidden = true; elPlay.hidden = true;
  elLearn.innerHTML = `
    <div class="hero">
      <div class="letter" aria-label="字母 ${L}">${L}</div>
      <div class="say">
        <p class="tip">${info.tip}</p>
        <p class="word">${info.word}</p>
      </div>
      <button type="button" class="icon-btn" id="sayBtn" aria-label="听一听 ${L}">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="tone-grid">
      ${[0,1,2,3].map(t => `<div class="tone"><div class="m">${TM[L][t]}</div>${contourSVG(t, 64, 44)}<div class="n">${TONE_NAMES[t]}</div><div class="d">${TONE_SHORT[t]}</div></div>`).join('')}
    </div>
    <p class="song">一声平，二声扬，三声拐弯，四声降。</p>
    <div style="text-align:center"><button type="button" class="cta" id="startBtn">开始爬楼梯</button></div>`;
  elLearn.hidden = false;
  $('sayBtn').addEventListener('click', () => { actx(); speak(info.say, true); });
  $('startBtn').addEventListener('click', () => { actx(); startFlight(); });
  renderTabs(); renderHearts(); renderLevel();
}

/* ================= 出题 ================= */
const pick = a => a[Math.floor(Math.random() * a.length)];
function targetFor(i, onlyCurrent){
  const L = LETTERS[i];
  const cur = PARSED.filter(x => x.v === L);
  const earlier = PARSED.filter(x => LETTERS.indexOf(x.v) < i);
  let pool = (!onlyCurrent && earlier.length && Math.random() < .25) ? earlier : cur;
  pool = pool.filter(x => x !== S.last);
  const t = pick(pool.length ? pool : cur);
  S.last = t; return t;
}
function makeQ(){
  const i = S.i, L = LETTERS[i], type = SEQ[S.s];
  const pool = PARSED.filter(x => LETTERS.indexOf(x.v) <= i);
  const py = (txt, size) => `<span class="py" style="font-size:${size}px;font-weight:700;line-height:1.1">${txt}</span>`;

  if (type === 'final'){
    const t = targetFor(i, true);
    const earlier = shuffle(LETTERS.slice(0, i)), later_ = shuffle(LETTERS.slice(i + 1));
    const others = [...earlier, ...later_].slice(0, 2);
    return {
      prompt: '这个音节里有哪个字母？', big: py(mark(t.p), 62), listen: t.c, speak: t.c,
      opts: shuffle([L, ...others]).map(v => ({text: v, cls: 'py big', ok: v === L})),
      explain: `${mark(t.p)} 里有 ${L}。`
    };
  }
  if (type === 'toneName'){
    const n = Math.floor(Math.random() * 4);
    const ids = [n, ...shuffle([0,1,2,3].filter(x => x !== n)).slice(0, 2)].sort();
    return {
      prompt: '这个字母是第几声？', big: py(TM[L][n], 96),
      opts: ids.map(x => ({text: TONE_NAMES[x], cls: 'txt', ok: x === n})),
      explain: `${TM[L][n]} 是${TONE_NAMES[n]}，${TONE_DESC[n]}。`
    };
  }
  if (type === 'toneFind'){
    const n = Math.floor(Math.random() * 4);
    const ids = shuffle([n, ...shuffle([0,1,2,3].filter(x => x !== n)).slice(0, 2)]);
    return {
      prompt: '声音这样走，是哪个字母？',
      big: `<div>${contourSVG(n, 132, 92)}<div class="cap">${TONE_NAMES[n]}</div></div>`,
      opts: ids.map(x => ({text: TM[L][x], cls: 'py big', ok: x === n})),
      explain: `${TONE_NAMES[n]}写成 ${TM[L][n]}，${TONE_DESC[n]}。`
    };
  }
  const t = targetFor(i, false);
  if (type === 'c2p'){
    return {
      prompt: '这个字怎么读？',
      big: `<span class="kai" style="font-size:78px;line-height:1.1">${t.c}</span>`, listen: t.c, speak: t.c,
      opts: pyOptions(t, pool).map(p => ({text: mark(p), cls: 'py', ok: p === t.p})),
      explain: `${t.c} 读 ${mark(t.p)}。`
    };
  }
  return {
    prompt: '哪个字读这个音？', big: py(mark(t.p), 58), speak: t.c,
    opts: charOptions(t, pool).map(x => ({text: x.c, cls: 'kai', ok: x.c === t.c})),
    explain: `${t.c} 读 ${mark(t.p)}。`
  };
}
function renderQ(){
  const q = S.q = makeQ();
  elPrompt.textContent = q.prompt;
  elBig.innerHTML = q.big;
  elListen.hidden = !q.listen;
  elOptions.innerHTML = q.opts.map((o, k) => `<button type="button" class="opt ${o.cls}" data-i="${k}">${o.text}</button>`).join('');
  elFb.textContent = ''; elFb.className = 'feedback';
  S.busy = false;
}

/* ================= 动画 ================= */
function explode(){
  snail.classList.add('gone'); leash.classList.add('gone');
  restart(boom, 'go');
  mood('shock'); restart(royBody, 'shake', ['hop']);
  sfxBoom();
  later(() => { boom.classList.remove('go'); mood('sad'); }, 1100);
}
function respawn(){
  snail.classList.remove('gone','crawl'); leash.classList.remove('gone');
  restart(snail, 'pop', ['crawl']);
}
function confetti(){
  const box = $('scene-wrap'), colors = ['#FF7B6B','#FFC83D','#3DAA6D','#4C9BE8','#B78BFF'];
  for (let i = 0; i < 36; i++){
    const d = document.createElement('i');
    d.className = 'confetti';
    d.style.left = Math.random()*100 + '%';
    d.style.background = colors[i % 5];
    d.style.animationDelay = Math.random()*.6 + 's';
    d.style.animationDuration = (1.8 + Math.random()*1.4) + 's';
    d.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    box.appendChild(d);
    setTimeout(() => d.remove(), 3800);
  }
}

/* ================= 答题 ================= */
function answer(k){
  if (S.busy || !S.q) return;
  S.busy = true;
  const q = S.q, o = q.opts[k];
  [...elOptions.children].forEach((b, j) => { b.disabled = true; if (q.opts[j].ok) b.classList.add('right'); });
  if (!o.ok) elOptions.children[k].classList.add('wrong');
  if (q.speak) later(() => speak(q.speak), 750);

  if (o.ok){
    S.s++;
    sfxOk(); mood('cheer');
    restart(snail, 'crawl', ['pop']);
    place(S.s); renderLevel();
    elFb.className = 'feedback ok';
    elFb.textContent = `Roy：答对啦！${q.explain}`;
    later(() => restart(royBody, 'hop', ['shake']), 850);
    if (S.s >= STEPS) later(win, 1500);
    else later(() => { mood('happy'); renderQ(); }, 1800);
  } else {
    S.hearts--;
    explode(); renderHearts(S.hearts);
    elFb.className = 'feedback bad';
    elFb.textContent = `Roy：哎呀，小蜗牛爆炸了！${q.explain}`;
    later(respawn, 1300);
    if (S.hearts <= 0) later(lose, 2200);
    else later(() => { mood('happy'); renderQ(); }, 2100);
  }
}

function overlay(title, text, btn, onBtn, link, onLink){
  elOv.innerHTML = `<h2>${title}</h2><p>${text}</p><button type="button" class="cta" id="goBtn">${btn}</button>${link ? `<button type="button" class="link-btn" id="linkBtn">${link}</button>` : ''}`;
  elOv.hidden = false;
  $('goBtn').addEventListener('click', onBtn);
  if (link) $('linkBtn').addEventListener('click', onLink);
  $('goBtn').focus({preventScroll:true});
}
function win(){
  const L = LETTERS[S.i], next = LETTERS[S.i + 1];
  if (!S.done.includes(L)){ S.done.push(L); saveDone(); }
  renderTabs();
  mood('cheer'); confetti(); sfxWin(); restart(royBody, 'hop', ['shake']);
  later(() => {
    if (next) overlay(`${L} 学会啦！`, `Roy 和小蜗牛爬完了 ${STEPS} 级楼梯，还剩 ${S.hearts} 颗心。下一个字母是 ${next}。`, `去学 ${next}`, () => showLearn(S.i + 1), '再练一次 ' + L, startFlight);
    else overlay('a o e i u 全都学会啦！', `五个字母都通关了，你真棒！想复习的话，可以点上面的字母再练。`, '从 a 再来一遍', () => showLearn(0));
  }, 1300);
}
function lose(){
  mood('sad');
  overlay('心用完啦', `小蜗牛爬到了第 ${S.s} 级。再试一次吧！`, '再爬一次', startFlight, '先看看学习卡', () => showLearn(S.i));
}
function startFlight(){
  clearTimers();
  S.s = 0; S.hearts = LIVES; S.last = null; S.busy = true;
  snail.classList.remove('gone','crawl','pop'); leash.classList.remove('gone'); boom.classList.remove('go');
  royBody.classList.remove('hop','shake'); mood('happy');
  place(0, true); renderHearts(); renderLevel(); renderTabs();
  elLearn.hidden = true; elOv.hidden = true; elPlay.hidden = false;
  renderQ();
}

/* ================= 事件 ================= */
elOptions.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) answer(+b.dataset.i); });
elListen.addEventListener('click', () => { actx(); if (S.q && S.q.listen) speak(S.q.listen, true); });
elTabs.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b || b.disabled) return;
  showLearn(+b.dataset.i);
});
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  if (!soundOn){ try { speechSynthesis.cancel(); } catch(e){} }
});
document.addEventListener('keydown', e => {
  if (['1','2','3'].includes(e.key) && !S.busy && S.q && elOv.hidden && !elPlay.hidden) answer(+e.key - 1);
});

// 打开时，进入第一个还没学会的字母
const first = LETTERS.findIndex(v => !S.done.includes(v));
showLearn(first < 0 ? 0 : first);
})();
</script>
